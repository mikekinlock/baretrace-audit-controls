# Toolchain shared by pull-request.yml and deployment.yml, so the two pipelines do
# not repeat it. This repository has no lambdas and no Go or Node tooling, so
# Terraform is all there is. Third-party actions are pinned by commit SHA.
name: setup
description: Terraform for baretrace-audit-controls
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.16.5
        terraform_wrapper: false
